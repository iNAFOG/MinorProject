# Same as e8.yaml, with a fixed local model and a 600 s task time limit for slow local inference.
condition: E8
tools: true
memory: true
temporary_agents: false
recursive_context: true
fixed_agents: false
dynamic_agents: true
skills: true
self_refinement: true
verification_gate: true
basic_verification: true
versioning: true
rollback: true
context_mode: recursive
seed: 0
epsilon: 1.0e-05
limits:
  max_depth: 2
  max_model_calls: 24
  max_subagents: 6
  max_tokens: 24000
  max_execution_time: 600
  max_tool_calls: 40
  max_context_chars: 6000
  max_output_chars: 12000
model:
  backend: transformers
  model: Qwen/Qwen2.5-1.5B-Instruct
  cache_dir: D:/cache/huggingface/hub
  temperature: 0
  max_output_tokens: 768
  input_cost_per_million: 0
  output_cost_per_million: 0


